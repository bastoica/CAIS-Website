<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Cisco bridge/signal bars -->
  <g fill="#049fd9">
    <!-- Bar 1 (leftmost, short) -->
    <rect x="40" y="22" width="4" height="12" rx="2"/>
    <!-- Bar 2 -->
    <rect x="52" y="16" width="4" height="18" rx="2"/>
    <!-- Bar 3 -->
    <rect x="64" y="10" width="4" height="24" rx="2"/>
    <!-- Bar 4 -->
    <rect x="76" y="4" width="4" height="30" rx="2"/>
    <!-- Bar 5 (center, tallest) -->
    <rect x="88" y="0" width="4" height="34" rx="2"/>
    <!-- Bar 6 -->
    <rect x="100" y="4" width="4" height="30" rx="2"/>
    <!-- Bar 7 -->
    <rect x="112" y="10" width="4" height="24" rx="2"/>
    <!-- Bar 8 -->
    <rect x="124" y="16" width="4" height="18" rx="2"/>
    <!-- Bar 9 (rightmost, short) -->
    <rect x="136" y="22" width="4" height="12" rx="2"/>
  </g>
  <!-- Cisco wordmark -->
  <text x="100" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#049fd9" letter-spacing="2">cisco</text>
</svg>